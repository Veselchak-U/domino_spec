schema: spec-driven

context: |
  Проект: domino_spec.
  Репозиторий правил игры, спецификаций и документации с JSON-примерами.
  Кода приложения и выбранного стека реализации нет.
  Документация находится в docs/, спецификации и планы — в openspec/.
  Проверка: openspec validate --all --strict --no-interactive.
  JSON-примеры проверяются по схеме и воспроизведением правил игры.
  Отвечай пользователю и пиши описания артефактов на русском языке.
  Сохраняй обязательные заголовки и ключевые слова формата OpenSpec.

