schema: spec-driven

context: |
  Проект: domino_analyzer.
  Стек: Flutter и Dart; единственная целевая платформа — веб.
  Исходный код находится в lib/, тесты — в test/, веб-оболочка — в web/.
  Зависимости управляются через pubspec.yaml и flutter pub.
  Проверка кода: flutter analyze. Тесты: flutter test.
  Сборка веб-приложения: flutter build web.
  Отвечай пользователю и пиши описания артефактов на русском языке.
  Сохраняй обязательные заголовки и ключевые слова формата OpenSpec.

